name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # macos-latest is Apple Silicon, which is the only target tread ships.
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          mkdir -p dist
          # BUN_NO_CODESIGN_MACHO_BINARY works around the bun 1.3.12 regression
          # where --compile emits a corrupt signature and macOS SIGKILLs the
          # binary; ad-hoc sign it ourselves afterwards.
          BUN_NO_CODESIGN_MACHO_BINARY=1 bun build --compile --minify \
            src/index.ts --outfile dist/tread
          codesign --sign - --force dist/tread
          dist/tread --version

      - name: Package
        run: |
          tar -czf "tread-${TARGET}.tar.gz" -C dist tread
          shasum -a 256 "tread-${TARGET}.tar.gz" > "tread-${TARGET}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tread-${{ env.TARGET }}.tar.gz
            tread-${{ env.TARGET }}.tar.gz.sha256
